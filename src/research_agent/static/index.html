<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究助手 - Research Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1b26;--surface2:#24253a;--border:#2e2f45;
  --text:#e1e2e8;--text2:#8b8fa3;--accent:#6c63ff;--accent2:#8b85ff;
  --green:#4ade80;--yellow:#facc15;--red:#f87171;--blue:#60a5fa;
  --radius:12px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-header h1 span{font-size:22px}
.sidebar-header p{font-size:12px;color:var(--text2);margin-top:4px}
.btn-new-chat{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-new-chat:hover{background:var(--accent2)}

.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);padding:16px 20px 8px;font-weight:600}

/* Conversation list */
.conv-list{padding:0 8px;max-height:240px;overflow-y:auto}
.conv-list::-webkit-scrollbar{width:4px}
.conv-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.conv-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;transition:background .15s;position:relative}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);border-left:3px solid var(--accent)}
.conv-item .conv-icon{font-size:14px;flex-shrink:0;color:var(--text2)}
.conv-item .conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.conv-item.active .conv-title{color:var(--text);font-weight:500}
.conv-item .conv-delete{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;transition:opacity .15s}
.conv-item:hover .conv-delete{opacity:0.7}
.conv-item .conv-delete:hover{opacity:1;background:rgba(248,113,113,0.15)}
.conv-item .conv-streaming{font-size:10px;color:var(--accent);animation:convPulse 1.2s infinite;flex-shrink:0}
@keyframes convPulse{0%,100%{opacity:1}50%{opacity:.2}}
.conv-empty{font-size:12px;color:var(--text2);padding:8px 20px;opacity:0.6}

.specialist-list{padding:0 12px;overflow-y:auto}
.specialist{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:2px;transition:background .15s}
.specialist:hover{background:var(--surface2)}
.specialist .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--border);transition:background .3s,box-shadow .3s}
.specialist .dot.available{background:var(--green)}
.specialist .dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.specialist .dot.unavailable{background:var(--red)}
.specialist .name{flex:1;color:var(--text2);transition:color .2s}
.specialist .name.lit{color:var(--text);font-weight:500}
.specialist .badge{font-size:10px;color:var(--accent);opacity:0;transition:opacity .2s}
.specialist .badge.show{opacity:1}

/* Stats */
.stats{padding:16px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)}
.stats .row{display:flex;justify-content:space-between;padding:3px 0}
.stats .val{color:var(--text);font-variant-numeric:tabular-nums}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* Top bar */
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;background:var(--surface);flex-shrink:0}
.topbar .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.topbar .status-dot.degraded{background:var(--yellow)}
.topbar .status-dot.offline{background:var(--red)}
.topbar .status-label{font-size:12px;color:var(--text2)}
.topbar .thread-id{margin-left:auto;font-size:11px;color:var(--text2);font-family:monospace;background:var(--surface2);padding:4px 10px;border-radius:6px}
.topbar .req-id{font-size:11px;color:var(--text2);font-family:monospace}

/* Messages area */
.messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{max-width:85%;line-height:1.6;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.msg.user{align-self:flex-end;background:var(--accent);color:#fff;padding:12px 18px;border-radius:var(--radius) var(--radius) 4px var(--radius);font-size:14px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--border);padding:16px 20px;border-radius:4px var(--radius) var(--radius) var(--radius);font-size:14px;width:85%}
.msg.assistant .content{white-space:pre-wrap;word-break:break-word}
.msg.assistant .content h3,.msg.assistant .content h4{margin:12px 0 6px;color:var(--accent2)}
.msg.assistant .content ul,.msg.assistant .content ol{padding-left:20px;margin:6px 0}

.msg .handoff-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--accent2);margin:4px 4px 4px 0}
.msg .handoff-tag::before{content:"→";color:var(--accent)}
.msg .tool-call-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:3px 0;font-family:'Fira Code','Consolas',monospace;opacity:0.85}
.msg .tool-call-line .tc-icon{color:var(--accent);font-size:11px}
.msg .tool-call-line .tc-specialist{color:var(--accent2);font-weight:600}
.msg .tool-call-line .tc-tool{color:var(--green,#4ade80)}

.md-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.md-table th,.md-table td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md-table th{background:var(--surface2);font-weight:600;color:var(--accent2)}
.md-table tr:nth-child(even){background:rgba(255,255,255,0.02)}

.token-stream{white-space:pre-wrap;line-height:1.7}

.msg .phase-tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:6px}

.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* Welcome */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:12px;padding:40px}
.welcome .icon{font-size:48px}
.welcome h2{color:var(--text);font-size:22px;font-weight:600}
.welcome p{max-width:420px;text-align:center;line-height:1.6;font-size:14px}
.welcome .examples{display:flex;flex-direction:column;gap:8px;margin-top:12px;width:100%;max-width:480px}
.welcome .example{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.welcome .example:hover{border-color:var(--accent);background:var(--surface2)}

/* Input */
.input-area{padding:16px 24px 20px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;resize:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-size:14px;font-family:inherit;line-height:1.5;max-height:120px;outline:none;transition:border-color .15s}
.input-row textarea:focus{border-color:var(--accent)}
.input-row textarea::placeholder{color:var(--text2)}
.input-row button{width:44px;height:44px;border-radius:var(--radius);background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.input-row button:hover{background:var(--accent2)}
.input-row button:disabled{background:var(--border);cursor:not-allowed}
.input-row button svg{width:20px;height:20px}
.input-meta{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--text2)}
.input-meta label{display:flex;align-items:center;gap:4px}
.input-meta input{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text);font-size:11px;width:100px;outline:none;font-family:monospace}

.upload-zone{border:1px dashed var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;text-align:center;font-size:12px;color:var(--text2);cursor:pointer;transition:border-color .15s,background .15s}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(108,99,255,0.08);color:var(--text)}
.upload-zone .upload-title{color:var(--text);font-size:13px;margin-bottom:4px}
.upload-zone .upload-hint{font-size:11px}
.upload-status{font-size:11px;color:var(--text2);margin-top:6px;min-height:16px}
.upload-status.ok{color:var(--green)}
.upload-status.err{color:var(--red)}
.knowledge-list{font-size:11px;color:var(--text2);padding:0 20px 12px;max-height:80px;overflow-y:auto}
.knowledge-list .kb-item{padding:2px 0;display:flex;justify-content:space-between;gap:8px}

/* HITL review panel */
.review-panel{background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius);padding:16px 20px;margin-top:12px;animation:fadeIn .25s ease}
.review-panel .review-title{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.review-panel .review-title::before{content:"⏸";font-size:16px}
.review-panel .review-draft{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;max-height:200px;overflow-y:auto;margin-bottom:12px;white-space:pre-wrap;line-height:1.5;color:var(--text2)}
.review-panel textarea{width:100%;resize:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit;line-height:1.5;min-height:60px;outline:none;transition:border-color .15s;margin-bottom:10px}
.review-panel textarea:focus{border-color:var(--accent)}
.review-panel textarea::placeholder{color:var(--text2)}
.review-actions{display:flex;gap:10px}
.review-actions button{padding:8px 20px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.review-actions .btn-approve{background:var(--green);color:#000}
.review-actions .btn-approve:hover{background:#86efac}
.review-actions .btn-revise{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.review-actions .btn-revise:hover{background:var(--surface2);border-color:var(--accent)}

/* Error toast */
.toast{position:fixed;top:16px;right:16px;background:var(--red);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:999;animation:fadeIn .2s ease;display:none}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .msg{max-width:95%}
  .msg.assistant{width:95%}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><span>🔬</span> 研究助手</h1>
      <button class="btn-new-chat" onclick="newThread()">+ 新对话</button>
    </div>
    <div class="section-title">历史对话</div>
    <div class="conv-list" id="convList"><div class="conv-empty">暂无对话</div></div>
    <div class="section-title">专家团队</div>
    <div class="specialist-list" id="specialistList"></div>
    <div class="section-title">知识库</div>
    <div class="knowledge-list" id="knowledgeList">暂无集合</div>
    <div class="stats" id="statsPanel">
      <div class="section-title" style="padding:0 0 8px">会话统计</div>
      <div id="tierStats"></div>
      <div class="row" style="border-top:1px solid var(--surface2);margin-top:6px;padding-top:6px"><span>合计 Token</span><span class="val" id="statTotal">-</span></div>
      <div class="row"><span>LLM 调用次数</span><span class="val" id="statCalls">-</span></div>
      <div class="row"><span>预估费用</span><span class="val" id="statCost">-</span></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">连接中...</span>
      <span class="thread-id" id="threadDisplay">-</span>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="icon">🔬</div>
        <h2>A 股金融研究助手</h2>
        <p>基于 LangGraph 多智能体协作的 A 股深度研究系统。输入问题，supervisor 会自动路由到对应的专家完成调研。</p>
        <div class="examples">
          <div class="example" onclick="fillQuery(this)">分析今日收盘情况，预测明天走势</div>
          <div class="example" onclick="fillQuery(this)">今天哪些板块和个股涨得最好？科技股表现如何？</div>
          <div class="example" onclick="fillQuery(this)">上证指数和创业板最近一周走势对比分析</div>
          <div class="example" onclick="fillQuery(this)">查一下宁德时代最新财报和市场舆情</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('pdfFileInput').click()">
        <div class="upload-title">拖拽 PDF 到此处，或点击上传</div>
        <div class="upload-hint">导入后可向知识库专家提问，例如「在我上传的报告里检索…」</div>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
      <input type="file" id="pdfFileInput" accept=".pdf,application/pdf" hidden />
      <div class="input-row">
        <textarea id="queryInput" rows="1" placeholder="输入研究问题..." onkeydown="handleKey(event)"></textarea>
        <button id="sendBtn" onclick="sendQuery()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
      <div class="input-meta">
        <label>用户 ID: <input id="userIdInput" value="demo_user" onchange="refreshKnowledgeCollections();loadConversations()" /></label>
        <label>知识库集合: <input id="collectionInput" value="default" title="上传 PDF 时写入的集合名称" /></label>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ALL_SPECIALISTS = [
  {id:'data_expert',    label:'数据专家',    desc:'财务数据 / 行情'},
  {id:'report_expert',  label:'公告专家',    desc:'公告 / 年报 PDF'},
  {id:'coder_expert',   label:'代码专家',    desc:'Python 计算'},
  {id:'news_expert',    label:'新闻专家',    desc:'新闻 / 快讯'},
  {id:'knowledge_expert',label:'知识库专家', desc:'用户知识库'},
  {id:'sentiment_expert',label:'舆情专家',   desc:'舆情量化'},
];

// =====================================================================
// 多会话并发核心状态
// =====================================================================
let currentThread = null;
let available = new Set();
let hitlPendingThread = null;

// 每个 thread 的独立状态：{ el: HTMLElement, streaming: bool }
// el 是一个 div 容器，持有该会话的所有消息 DOM（可脱离文档树）
const threadData = new Map();
const streamingThreads = new Set();

function _getOrCreateThreadEl(threadId) {
  if (threadData.has(threadId)) return threadData.get(threadId).el;
  const el = document.createElement('div');
  el.className = 'thread-container';
  el.style.cssText = 'display:flex;flex-direction:column;gap:16px;min-height:100%';
  threadData.set(threadId, { el, streaming: false });
  return el;
}

function _isCurrentThreadStreaming() {
  return currentThread && streamingThreads.has(currentThread);
}

function _updateSendBtn() {
  const btn = document.getElementById('sendBtn');
  btn.disabled = _isCurrentThreadStreaming();
}

// =====================================================================
// 初始化
// =====================================================================
function init() {
  renderSpecialists([]);
  checkHealth();
  refreshUsage();
  refreshKnowledgeCollections();
  setupUploadZone();
  setInterval(refreshUsage, 15000);
  autoResize(document.getElementById('queryInput'));
  loadConversations();
}

function getUserId() {
  return document.getElementById('userIdInput').value.trim() || 'anonymous';
}

// =====================================================================
// 会话列表（侧边栏）
// =====================================================================
async function loadConversations() {
  const userId = getUserId();
  try {
    const resp = await fetch(`/api/conversations?user_id=${encodeURIComponent(userId)}`);
    if (!resp.ok) return;
    const convs = await resp.json();
    renderConvList(convs);
  } catch {}
}

function renderConvList(convs) {
  const el = document.getElementById('convList');
  if ((!convs || convs.length === 0) && streamingThreads.size === 0) {
    el.innerHTML = '<div class="conv-empty">暂无对话</div>';
    return;
  }
  const allIds = new Set((convs||[]).map(c => c.thread_id));
  // 把正在流式但还没被后端返回的 thread 也加进来
  const items = [...(convs||[])];
  for (const tid of streamingThreads) {
    if (!allIds.has(tid)) {
      const td = threadData.get(tid);
      items.unshift({ thread_id: tid, title: td?._title || '新对话…', msg_count: 0, _local: true });
    }
  }
  if (items.length === 0) {
    el.innerHTML = '<div class="conv-empty">暂无对话</div>';
    return;
  }
  el.innerHTML = items.map(c => {
    const active = c.thread_id === currentThread ? ' active' : '';
    const title = c.title || '未命名对话';
    const isStreaming = streamingThreads.has(c.thread_id);
    const streamBadge = isStreaming ? '<span class="conv-streaming">● 处理中</span>' : '';
    return `<div class="conv-item${active}" data-tid="${c.thread_id}" onclick="switchConversation('${c.thread_id}')">
      <span class="conv-icon">💬</span>
      <span class="conv-title" title="${title}">${title}</span>
      ${streamBadge}
      <button class="conv-delete" onclick="event.stopPropagation();deleteConversation('${c.thread_id}')" title="删除">✕</button>
    </div>`;
  }).join('');
}

// =====================================================================
// 切换会话（核心：交换可见容器）
// =====================================================================
async function switchConversation(threadId) {
  if (threadId === currentThread) return;
  currentThread = threadId;
  document.getElementById('threadDisplay').textContent = threadId.slice(0, 12) + '…';
  document.getElementById('threadDisplay').title = threadId;
  _updateSendBtn();

  document.querySelectorAll('.conv-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tid === threadId);
  });

  const msgArea = document.getElementById('messages');

  // 如果该 thread 的 DOM 容器已经在内存中（正在流式或刚完成），直接显示
  if (threadData.has(threadId)) {
    msgArea.innerHTML = '';
    msgArea.appendChild(threadData.get(threadId).el);
    // 恢复该会话的专家高亮
    if (streamingThreads.has(threadId)) {
      const td = threadData.get(threadId);
      if (td._activeSpecialist) highlightSpecialist(td._activeSpecialist);
    } else {
      clearHighlights();
    }
    scrollToBottom();
    return;
  }

  // 否则从后端加载
  msgArea.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px">加载中...</div>';
  try {
    const resp = await fetch(`/api/conversations/${threadId}/messages`);
    if (!resp.ok) throw new Error('Failed to load');
    const msgs = await resp.json();
    const container = _getOrCreateThreadEl(threadId);
    container.innerHTML = '';
    if (msgs.length === 0) {
      msgArea.innerHTML = '';
      showWelcome();
      return;
    }
    msgs.forEach(m => {
      if (m.role === 'user') {
        _appendUserMsg(container, m.content);
      } else if (m.role === 'assistant') {
        const d = document.createElement('div');
        d.className = 'msg assistant';
        d.innerHTML = '<div class="content">' + renderMarkdown(m.content) + '</div>';
        container.appendChild(d);
      }
    });
    msgArea.innerHTML = '';
    msgArea.appendChild(container);
    scrollToBottom();
  } catch {
    msgArea.innerHTML = '<div style="text-align:center;color:var(--red);padding:40px">加载失败</div>';
  }
}

async function deleteConversation(threadId) {
  if (!confirm('确定删除这个对话？')) return;
  const userId = getUserId();
  try {
    await fetch(`/api/conversations/${threadId}?user_id=${encodeURIComponent(userId)}`, {method: 'DELETE'});
    threadData.delete(threadId);
    if (currentThread === threadId) newThread();
    loadConversations();
  } catch {}
}

function showWelcome() {
  const m = document.getElementById('messages');
  m.innerHTML = `<div class="welcome" id="welcome">
    <div class="icon">🔬</div>
    <h2>A 股金融研究助手</h2>

function _appendUserMsg(container, text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.textContent = text;
  container.appendChild(d);
}

function _appendAssistantMsg(container) {
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.innerHTML = '<div class="phase-tag">思考中</div><div class="handoffs"></div><div class="content"></div><div class="typing"><span></span><span></span><span></span></div>';
  container.appendChild(d);

function addUserMsg(text) {
  document.getElementById('welcome')?.remove();

function scrollToBottom() {

// =====================================================================
// 发送查询（非阻塞：启动流后立即释放 UI）
// =====================================================================
function sendQuery() {
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;
  if (_isCurrentThreadStreaming()) return;

  input.value = '';
  input.style.height = 'auto';

  const sendThreadId = currentThread;
  const userId = getUserId();

  // 启动后台流，不 await
  _runStream(query, sendThreadId, userId);
}

async function _runStream(query, sendThreadId, userId) {
  let threadId = sendThreadId;

  try {
    const resp = await fetch('/api/supervisor/research/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query, user_id: userId, thread_id: threadId }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({detail: resp.statusText}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }

    const resolvedId = resp.headers.get('X-Thread-ID');
    if (resolvedId) threadId = resolvedId;

    // 注册流状态
    const container = _getOrCreateThreadEl(threadId);
    const td = threadData.get(threadId);
    td.streaming = true;
    td._title = query.slice(0, 40);
    td._activeSpecialist = null;
    streamingThreads.add(threadId);

    // 追加用户消息到该容器
    _appendUserMsg(container, query);
    const msgEl = _appendAssistantMsg(container);
    const phaseTag = msgEl.querySelector('.phase-tag');
    const handoffsEl = msgEl.querySelector('.handoffs');
    const contentEl = msgEl.querySelector('.content');
    const typingEl = msgEl.querySelector('.typing');

    // 如果发送时还在看这个线程（或是新会话），切换到它
    if (!sendThreadId || sendThreadId === threadId || currentThread === null || currentThread === sendThreadId) {
      currentThread = threadId;
      document.getElementById('threadDisplay').textContent = threadId.slice(0, 12) + '…';
      document.getElementById('threadDisplay').title = threadId;
      const msgArea = document.getElementById('messages');
      msgArea.innerHTML = '';
      msgArea.appendChild(container);
    }

    _updateSendBtn();
    renderConvList([]); // 临时刷新，后面 loadConversations 会覆盖
    loadConversations();

    // --- SSE 处理循环 ---
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalText = '';
    let tokenBuf = '';
    let tokenStreamStarted = false;
    let tokenStreamEl = null;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data:')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
        const viewing = (threadId === currentThread);

        switch (evt.phase) {
          case 'update':
            phaseTag.textContent = '处理中';
            if (evt.metadata?.available_specialists && viewing) {
              renderSpecialists(evt.metadata.available_specialists);
            }
            break;

          case 'handoff': {
            const specialist = evt.metadata?.specialist || evt.content;
            phaseTag.textContent = '→ ' + specialist;
            const tag = document.createElement('span');
            tag.className = 'handoff-tag';
            tag.textContent = specialist;
            handoffsEl.appendChild(tag);
            td._activeSpecialist = specialist;
            if (viewing) highlightSpecialist(specialist);
            _scrollIfViewing(threadId);
            break;
          }

          case 'tool_call': {
            const tcLine = document.createElement('div');
            tcLine.className = 'tool-call-line';
            const sp = evt.metadata?.specialist || evt.node || '';
            const tool = evt.metadata?.tool || '';
            tcLine.innerHTML =
              `<span class="tc-icon">⚙</span>` +
              `<span class="tc-specialist">${sp}</span> ` +
              `<span class="tc-tool">${tool}</span>` +
              (evt.content ? `<span>(${evt.content.split('(').slice(1).join('(')})</span>` : '');
            contentEl.appendChild(tcLine);
            _scrollIfViewing(threadId);
            break;
          }

          case 'token': {
            if (!tokenStreamStarted) {
              tokenStreamStarted = true;
              phaseTag.textContent = '回答中';
              phaseTag.style.color = 'var(--green)';
              contentEl.innerHTML = '';
              tokenStreamEl = document.createElement('div');
              tokenStreamEl.className = 'token-stream';
              contentEl.appendChild(tokenStreamEl);
            }
            tokenBuf += evt.content || '';
            tokenStreamEl.innerHTML = renderMarkdown(tokenBuf);
            _scrollIfViewing(threadId);
            break;
          }

          case 'final':
            phaseTag.textContent = '回答完成';
            finalText = evt.content || '';
            contentEl.innerHTML = renderMarkdown(finalText);
            typingEl.style.display = 'none';
            td._activeSpecialist = null;
            if (viewing) clearHighlights();
            _scrollIfViewing(threadId);
            break;

          case 'review_requested': {
            phaseTag.textContent = '等待审核';
            phaseTag.style.color = 'var(--yellow)';
            typingEl.style.display = 'none';
            td._activeSpecialist = null;
            if (viewing) clearHighlights();
            const draftText = evt.content || contentEl.textContent || '';
            if (draftText) contentEl.innerHTML = renderMarkdown(draftText);
            const reviewEl = document.createElement('div');
            reviewEl.className = 'review-panel';
            reviewEl.innerHTML = `
              <div class="review-title">需要人工审核</div>
              <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Supervisor 已生成初稿，请审阅后决定通过或修改。</p>
              <textarea class="review-feedback-input" placeholder="（可选）输入修改意见…"></textarea>
              <div class="review-actions">
                <button class="btn-approve" onclick="hitlApprove('${threadId}')">✓ 通过</button>
                <button class="btn-revise" onclick="hitlRevise('${threadId}')">✎ 修改</button>
              </div>
            `;
            msgEl.appendChild(reviewEl);
            hitlPendingThread = threadId;
            _scrollIfViewing(threadId);
            break;
          }

          case 'error':
            phaseTag.textContent = '出错';
            phaseTag.style.color = 'var(--red)';
            contentEl.textContent = evt.content || '未知错误';
            typingEl.style.display = 'none';
            td._activeSpecialist = null;
            if (viewing) clearHighlights();
            break;

          case 'heartbeat':
            break;

          case 'done':
            typingEl.style.display = 'none';
            if (!finalText && tokenBuf) finalText = tokenBuf;
            if (!finalText && contentEl.textContent) finalText = contentEl.textContent;
            td._activeSpecialist = null;
            if (viewing) clearHighlights();
            break;
        }
      }
    }

    if (finalText) contentEl.innerHTML = renderMarkdown(finalText);
    typingEl.style.display = 'none';
    refreshUsage();

  } catch (err) {
    // 如果该 thread 有容器，在上面显示错误
    if (threadData.has(threadId)) {
      const container = threadData.get(threadId).el;
      const lastAssistant = container.querySelector('.msg.assistant:last-of-type .content');
      if (lastAssistant) lastAssistant.textContent = '请求失败: ' + err.message;
      const lastTyping = container.querySelector('.msg.assistant:last-of-type .typing');
      if (lastTyping) lastTyping.style.display = 'none';
    }
    showToast('请求失败: ' + err.message);
  } finally {
    streamingThreads.delete(threadId);
    if (threadData.has(threadId)) threadData.get(threadId).streaming = false;
    _updateSendBtn();
    loadConversations();
  }
}

// =====================================================================
// 上传、知识库

function setupUploadZone() {
  const zone = document.getElementById('uploadZone');
  const input = document.getElementById('pdfFileInput');
  if (!zone || !input) return;
  ['dragenter', 'dragover'].forEach(ev => {
    zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(ev => {
    zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover'); });
  });
  zone.addEventListener('drop', e => {
    const files = e.dataTransfer?.files;
    if (files && files.length) uploadPdf(files[0]);
  });
  input.addEventListener('change', () => {
    if (input.files && input.files[0]) uploadPdf(input.files[0]);
    input.value = '';
  });
}

async function uploadPdf(file) {
  const statusEl = document.getElementById('uploadStatus');
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    statusEl.textContent = '仅支持 PDF 文件'; statusEl.className = 'upload-status err';
    showToast('仅支持 PDF 文件'); return;
  }
  const userId = getUserId();
  if (userId === 'anonymous') {
    statusEl.textContent = '请设置用户 ID（勿用 anonymous）后再上传';
    statusEl.className = 'upload-status err'; showToast('上传前请填写有效的用户 ID'); return;
  }
  const collection = document.getElementById('collectionInput').value.trim() || 'default';
  statusEl.textContent = `正在上传 ${file.name}…`; statusEl.className = 'upload-status';
  const form = new FormData(); form.append('file', file);
  try {
    const resp = await fetch(`/api/knowledge/ingest?collection=${encodeURIComponent(collection)}`, {
      method: 'POST', headers: {'X-User-ID': userId}, body: form,
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    statusEl.textContent = `已导入「${data.source}」→ 集合 ${data.collection}（${data.num_chunks_added} 块，共 ${data.total_chunks_in_collection} 块）`;
    statusEl.className = 'upload-status ok'; showToast('PDF 已导入知识库'); refreshKnowledgeCollections();
  } catch (err) {
    statusEl.textContent = '上传失败: ' + err.message; statusEl.className = 'upload-status err';
    showToast('上传失败: ' + err.message);
  }
}

async function refreshKnowledgeCollections() {
  const el = document.getElementById('knowledgeList');
  if (!el) return;
  const userId = getUserId();
  if (userId === 'anonymous') { el.textContent = '填写用户 ID 后可查看集合'; return; }
  try {
    const resp = await fetch('/api/knowledge/collections', { headers: {'X-User-ID': userId} });
    if (!resp.ok) { el.textContent = '无法加载集合'; return; }
    const data = await resp.json();
    const cols = data.collections || [];
    if (!cols.length) { el.textContent = '暂无集合（上传 PDF 后自动创建）'; return; }
    el.innerHTML = cols.map(c => `<div class="kb-item"><span>${c.name}</span><span>${c.chunk_count} 块</span></div>`).join('');
  } catch { el.textContent = '无法加载集合'; }
}

// =====================================================================
// 专家面板
// =====================================================================
function renderSpecialists(availableList) {
  available = new Set(availableList);
  const el = document.getElementById('specialistList');
  el.innerHTML = ALL_SPECIALISTS.map(s => {
    const state = available.has(s.id) ? 'available' : (availableList.length ? 'unavailable' : '');
    return `<div class="specialist" id="spec-${s.id}">
      <div class="dot ${state}"></div>
      <span class="name">${s.label}</span>
      <span class="badge" id="badge-${s.id}">调度中</span>
    </div>`;
  }).join('');
}

function highlightSpecialist(name) {
  ALL_SPECIALISTS.forEach(s => {
    const dot = document.querySelector(`#spec-${s.id} .dot`);
    const nm = document.querySelector(`#spec-${s.id} .name`);
    const badge = document.getElementById(`badge-${s.id}`);
    if (s.id === name) {
      if (dot) dot.className = 'dot active';
      if (nm) nm.classList.add('lit');
      if (badge) badge.classList.add('show');
    } else {
      if (dot && available.has(s.id)) dot.className = 'dot available';
      if (nm) nm.classList.remove('lit');
      if (badge) badge.classList.remove('show');
    }
  });
}

function clearHighlights() {
  ALL_SPECIALISTS.forEach(s => {
    const dot = document.querySelector(`#spec-${s.id} .dot`);
    const badge = document.getElementById(`badge-${s.id}`);
    if (dot && available.has(s.id)) dot.className = 'dot available';
    if (badge) badge.classList.remove('show');
    const nm = document.querySelector(`#spec-${s.id} .name`);
    if (nm) nm.classList.remove('lit');
  });
}

const TIER_LABELS = {heavy:'主力模型', medium:'分析模型', light:'轻量模型'};
async function refreshUsage() {
  try {
    const r = await fetch('/api/usage');
    const d = await r.json();
    const tierEl = document.getElementById('tierStats');
    let html = '', totalPt=0, totalCt=0, calls=0, cost=0;
    for (const tier of ['heavy','medium','light']) {
      const a = (d.by_agent||{})[tier];
      if (!a) continue;
      const pt = a.prompt_tokens||0, ct = a.completion_tokens||0;
      totalPt += pt; totalCt += ct;
      calls += a.call_count||0;
      cost += a.total_cost_cny||0;
      html += `<div style="margin-bottom:6px">`;
      html += `<div class="row" style="color:var(--accent);font-size:12px;margin-bottom:2px"><span>${TIER_LABELS[tier]}(${tier})</span><span class="val">${a.call_count||0}次</span></div>`;
      html += `<div class="row" style="font-size:11px;opacity:.7"><span>输入 ${pt.toLocaleString()}</span><span class="val">输出 ${ct.toLocaleString()}</span></div>`;
      html += `</div>`;
    }
    tierEl.innerHTML = html || '<div class="row" style="opacity:.5">暂无调用</div>';
    document.getElementById('statTotal').textContent = (totalPt+totalCt).toLocaleString();
    document.getElementById('statCalls').textContent = calls;
    document.getElementById('statCost').textContent = '¥' + cost.toFixed(4);
  } catch {}
}

// =====================================================================
// Markdown 渲染
// =====================================================================
function renderMarkdown(text) {
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    if (lines[i].trim().startsWith('|') && i + 1 < lines.length && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i+1])) {
      const headerCells = lines[i].split('|').filter(c => c.trim() !== '').map(c => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        rows.push(lines[i].split('|').filter(c => c.trim() !== '').map(c => c.trim()));
        i++;
      }
      let table = '<table class="md-table"><thead><tr>';
      headerCells.forEach(h => { table += `<th>${escAndInline(h)}</th>`; });
      table += '</tr></thead><tbody>';
      rows.forEach(r => { table += '<tr>'; r.forEach(c => { table += `<td>${escAndInline(c)}</td>`; }); table += '</tr>'; });
      table += '</tbody></table>';
      out.push(table);
    } else {
      out.push(renderLine(lines[i]));
      i++;
    }
  }
  let html = out.join('\n');
  html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
  return html;
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAndInline(s) {
  return escHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/`([^`]+)`/g, '<code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:13px">$1</code>');
}
function renderLine(line) {
  let s = escHtml(line);
  s = s.replace(/^#{1,6}\s+(.+)$/gm, '<div style="font-weight:600;margin:8px 0 4px">$1</div>');
  if (/^\s*[-*_]{3,}\s*$/.test(s)) return '<br>';
  s = s.replace(/\*\*(.+?)\*\*/g, '$1');
  s = s.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/^\s*(\d+)\. (.+)$/gm, '<li>$2</li>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:13px">$1</code>');
  if (s.trim() === '') s = '<br>';
  return s;
}

// =====================================================================
// 人机协作
// =====================================================================
async function hitlApprove(tid) {
  const threadId = tid || hitlPendingThread;
  if (!threadId) return;
  const container = threadData.get(threadId)?.el;
  const feedback = container?.querySelector('.review-feedback-input')?.value.trim() || '';
  await _hitlSubmit(threadId, 'approve', feedback);
}

async function hitlRevise(tid) {
  const threadId = tid || hitlPendingThread;
  if (!threadId) return;
  const container = threadData.get(threadId)?.el;
  const feedback = container?.querySelector('.review-feedback-input')?.value.trim() || '';
  if (!feedback) { showToast('请输入修改意见'); return; }
  await _hitlSubmit(threadId, 'resume', feedback);
}

async function _hitlSubmit(threadId, action, feedback) {
  hitlPendingThread = null;
  const container = threadData.get(threadId)?.el;
  const panel = container?.querySelector('.review-panel');
  if (panel) panel.innerHTML = '<div style="color:var(--text2);font-size:12px;padding:8px 0">正在处理...</div>';
  try {
    const resp = await fetch(`/api/supervisor/research/${threadId}/${action}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({feedback}),
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({detail: resp.statusText})); throw new Error(err.detail || `HTTP ${resp.status}`); }
    const data = await resp.json();
    if (panel) panel.remove();
    if (container) {
      const resultEl = document.createElement('div');
      resultEl.className = 'msg assistant';
      resultEl.innerHTML = `<div class="phase-tag" style="color:var(--green)">已通过 — 最终回答</div><div class="content">${renderMarkdown(data.reply || '')}</div>`;
      container.appendChild(resultEl);
    }
    _scrollIfViewing(threadId);
    refreshUsage();
  } catch (err) {
    showToast('操作失败: ' + err.message);
    if (panel) panel.innerHTML = `<div style="color:var(--red);font-size:12px">错误: ${err.message}</div>`;
    hitlPendingThread = threadId;
  }
}
