[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent deep research system powered by LangGraph, MCP, and Agentic RAG"
requires-python = ">=3.12"
dependencies = [
    # === LangGraph / LangChain Core ===
    "langgraph>=0.3",
    "langgraph-supervisor",
    "langgraph-checkpoint-postgres",
    "langchain>=0.3",
    "langchain-core",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-mcp-adapters",
    "langchain-chroma",
    # === MCP ===
    "mcp",
    "fastmcp",
    # === RAG ===
    "chromadb",
    "sentence-transformers",
    "unstructured[md,pdf]",
    "rank-bm25",
    # === LLM Providers ===
    "openai",
    "litellm",
    # === Web Framework ===
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2.0",
    "pydantic-settings",
    # === Database ===
    "sqlalchemy>=2.0",
    "asyncpg",
    "psycopg[binary,pool]",
    "psycopg-pool",
    "redis",
    # === Observability ===
    "langsmith",
    "loguru",
    "rich",
    "langchain-huggingface>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
    "pre-commit",
]

[project.scripts]
research-agent = "research_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
