[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent deep research system powered by LangGraph, MCP, and Agentic RAG"
requires-python = ">=3.12"
dependencies = [
    # === LangGraph / LangChain Core ===
    "langgraph>=0.3",
    "langgraph-supervisor",
    "langgraph-checkpoint-postgres",
    "langchain>=0.3",
    "langchain-core",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-mcp-adapters",
    # === MCP ===
    "mcp",
    "fastmcp",
    # === RAG ===
    # NOTE: We deliberately use FAISS (faiss-cpu) instead of Chroma. On
    # Windows, importing chromadb inside an MCP-stdio subprocess corrupts
    # the JSON-RPC channel between the parent client and the FastMCP
    # server (see _stdio_firewall.py for the full forensic trail).
    # FAISS has no telemetry, no background threads, and a much simpler
    # persistence model (single .faiss file + sidecar pickle), which is
    # both more reliable and a better fit for the 10s-1000s-of-chunks
    # personal-knowledge scale we target.
    "faiss-cpu",
    "sentence-transformers",
    "unstructured[md,pdf]",
    "rank-bm25",
    # === LLM Providers ===
    "openai",
    "litellm",
    # === Web Framework ===
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2.0",
    "pydantic-settings",
    # === Database ===
    "sqlalchemy>=2.0",
    "asyncpg",
    "psycopg[binary,pool]",
    "psycopg-pool",
    "redis",
    # === Observability ===
    "langsmith",
    "loguru",
    "rich",
    "langchain-huggingface>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "akshare>=1.18.56",
    "modelscope>=1.36.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
    "pre-commit",
]

[project.scripts]
research-agent = "research_agent.main:cli"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit live third-party HTTP endpoints (akshare, xueqiu, sina). Skip in offline CI with ``pytest -m 'not network'``.",
    "slow: tests that load heavy ML model weights (e.g. HuggingFace embedders) or run multi-second pipelines end-to-end. Opt-in via ``pytest -m slow``; skipped by default with ``pytest -m 'not slow'``.",
    "integration: end-to-end / cross-component tests that bring up FastAPI, MCP subprocesses, or a full graph. Run with ``pytest -m integration``; routinely skipped in unit-only flows.",
]
