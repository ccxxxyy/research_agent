name: Eval & Network Tests

on:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run LangSmith eval suite (costs LLM tokens)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  UV_INDEX_URL: https://pypi.org/simple
  UV_HTTP_TIMEOUT: 120

jobs:
  network-tests:
    name: Network Tests
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run network tests
        run: uv run pytest -m network -q --tb=short

  eval:
    name: Eval Suite
    if: github.event.inputs.run_eval == 'true'
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run evals
        run: uv run python -m evals.eval_supervisor --experiment-prefix nightly
