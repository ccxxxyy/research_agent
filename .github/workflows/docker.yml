name: Docker

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: research-agent
  UV_INDEX_URL: https://pypi.org/simple
  UV_HTTP_TIMEOUT: 120

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag name
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment the steps below to push to GitHub Container Registry.
      # You must add a GHCR_TOKEN secret or use the default GITHUB_TOKEN with
      # packages:write permission on the repository.
